<!doctype html>
<html lang='en'>
  <body style='margin:0;padding:32px 16px;background:#f4f5f2;font-family:Arial,sans-serif;color:#22312d;'>
    <table role='presentation' width='100%' cellspacing='0' cellpadding='0' border='0'>
      <tr>
        <td align='center'>
          <table role='presentation' width='100%' cellspacing='0' cellpadding='0' border='0' style='max-width:520px;background:#ffffff;border:1px solid #d9d6cd;border-radius:18px;'>
            <tr>
              <td style='padding:36px;'>
                <p style='margin:0 0 8px;color:#69788b;font-size:14px;font-weight:700;'>LifeCycle</p>
                <h1 style='margin:0 0 14px;font-size:26px;line-height:1.25;'>Verify your email</h1>
                <p style='margin:0 0 24px;color:#56645f;font-size:16px;line-height:1.6;'>Enter this verification code in the LifeCycle app to finish creating your account.</p>
                <div style='margin:0 0 24px;padding:18px;border-radius:12px;background:#eef1ec;color:#22312d;font-size:32px;font-weight:800;letter-spacing:8px;text-align:center;'>{{ .Token }}</div>
                <p style='margin:0 0 8px;color:#69788b;font-size:13px;line-height:1.6;'>This code expires in 60 minutes and can only be used once.</p>
                <p style='margin:0;color:#69788b;font-size:13px;line-height:1.6;'>If you did not create a LifeCycle account, you can safely ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
